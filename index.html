<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B5E">
<title>Bitácora TiL</title>
<style>
/* Programa propio. Los datos viven en un solo archivo JSON de tu Google Drive y se funden entre dispositivos. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E7EDEA; --fg:#111B19; --muted:#5A6B66;
  --line:#D3DDDA; --line-fuerte:#B6C4C0; --accent:#0B6B5E; --accent-ink:#FFFFFF; --accent-suave:#DCEDE8;
  --warn:#8E5400; --warn-bg:#F7E8CF; --danger:#9E3326; --danger-bg:#F6DED9; --ok:#246647; --ok-bg:#DCEEE2;
  --display:'Bahnschrift','Archivo','Segoe UI Semibold','Helvetica Neue',Arial,sans-serif;
  --texto:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --dato:'Consolas','IBM Plex Mono',ui-monospace,'Courier New',monospace;
  --sombra:0 1px 2px rgba(17,27,25,.06),0 8px 24px rgba(17,27,25,.07);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1211; --surface:#141D1B; --surface-2:#1C2725; --fg:#E3ECE9; --muted:#8DA09B;
  --line:#293735; --line-fuerte:#3A4A47; --accent:#43BCA6; --accent-ink:#05201B; --accent-suave:#15322D;
  --warn:#DCA055; --warn-bg:#352814; --danger:#E4867A; --danger-bg:#39201C; --ok:#63C18D; --ok-bg:#15301F;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1211; --surface:#141D1B; --surface-2:#1C2725; --fg:#E3ECE9; --muted:#8DA09B;
  --line:#293735; --line-fuerte:#3A4A47; --accent:#43BCA6; --accent-ink:#05201B; --accent-suave:#15322D;
  --warn:#DCA055; --warn-bg:#352814; --danger:#E4867A; --danger-bg:#39201C; --ok:#63C18D; --ok-bg:#15301F;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--texto);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.005em;font-weight:600;text-wrap:balance}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:12}

.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.barra-in{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.marca{display:flex;align-items:baseline;gap:9px;min-width:0}
.marca b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.marca span{font-family:var(--dato);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;gap:2px;flex:1 1 280px;min-width:0;overflow-x:auto}
.nav button{background:none;border:0;border-radius:7px;padding:7px 12px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent-suave);color:var(--accent)}
.nav .cuenta{font-family:var(--dato);font-size:11px;opacity:.75;margin-left:5px}
.sync{font-family:var(--dato);font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px;cursor:pointer;background:none;border:0;padding:4px 6px;border-radius:6px}
.sync:hover{background:var(--surface-2)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.punto.on{background:var(--ok)}.punto.off{background:var(--line-fuerte)}
.punto.trabaja{background:var(--warn);animation:late 1s infinite}
.punto.mal{background:var(--danger)}
@keyframes late{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.punto.trabaja{animation:none}}

main{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line-fuerte)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.chico{padding:6px 11px;font-size:13px}
.btn.peligro{background:none;color:var(--danger);border:1px solid var(--line-fuerte)}
.campo{background:var(--surface);border:1px solid var(--line-fuerte);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
label.lbl{display:block;font-family:var(--dato);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.vacio{border:1px dashed var(--line-fuerte);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted)}
.vacio h3{font-size:16px;color:var(--fg);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--dato);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.vence{background:var(--danger-bg);color:var(--danger)}
.pill.hoy{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.acc{background:var(--accent-suave);color:var(--accent)}
.sec-tit{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-tit h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em}
.sec-tit .nota{font-family:var(--dato);font-size:11px;color:var(--muted)}
.num{font-family:var(--dato);font-variant-numeric:tabular-nums}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.cifra{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.cifra b{font-family:var(--dato);font-size:26px;font-weight:500;display:block;line-height:1.15}
.cifra span{font-size:12.5px;color:var(--muted)}
.cifra.alerta{border-color:var(--danger);background:var(--danger-bg)}
.cifra.alerta b,.cifra.alerta span{color:var(--danger)}
.bloques{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}

.fila{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--surface-2)}
.fila-cuerpo{flex:1 1 auto;min-width:0}
.fila-cuerpo b{font-family:var(--display);font-size:15px;display:block;overflow-wrap:anywhere}
.fila-cuerpo small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.fila-lado{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.caja{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}

.filtros{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.filtros .campo{width:auto;flex:0 1 auto}
.filtros .buscar{flex:1 1 220px}

.capa{position:fixed;inset:0;z-index:30;background:rgba(10,20,18,.45);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.hoja{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sombra);width:100%;max-width:650px;margin-block:auto}
.hoja-cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.hoja-cab h2{font-size:19px}
.hoja-cuerpo{padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.cerrar{background:none;border:1px solid var(--line-fuerte);border-radius:8px;width:30px;height:30px;line-height:1;cursor:pointer;color:var(--muted);flex:0 0 auto}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ancho{grid-column:1/-1}
.pie{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;padding-top:4px}
.ficha-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:0}
.ficha-datos div{min-width:0}
.ficha-datos dt{font-family:var(--dato);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ficha-datos dd{margin:2px 0 0;overflow-wrap:anywhere}
.ficha-datos a{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-fuerte);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-suave);border-color:var(--accent);color:var(--accent);font-weight:600}
.hist-it{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-it:last-child{border-bottom:0}
.hist-it .f{font-family:var(--dato);font-size:12px;color:var(--muted);flex:0 0 76px;padding-top:2px}
.hist-it p{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}
.aviso{font-size:13px;color:var(--muted)}
.aviso.mal{color:var(--danger)}
.aviso.bien{color:var(--ok)}
.tacha{text-decoration:line-through;opacity:.55}
.banda{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.pasos code{font-family:var(--dato);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600}
.botonera{display:flex;flex-wrap:wrap;gap:9px}

#impresion{display:none}
@media print{
  .barra,main,.capa{display:none!important}
  #impresion{display:block;color:#000;background:#fff}
  #impresion h1{font-size:18pt;margin:0 0 2mm}
  #impresion .sub{font-size:9pt;color:#444;margin-bottom:6mm}
  #impresion h2{font-size:11pt;margin:6mm 0 2mm;border-bottom:1px solid #000;padding-bottom:1mm}
  #impresion .it{border-bottom:1px dotted #999;padding:2.5mm 0;page-break-inside:avoid}
  #impresion .it b{font-size:11pt}
  #impresion .it small{display:block;color:#333;font-size:9pt}
  #impresion .ren{margin-top:3mm;border-top:1px solid #000;height:14mm}
  @page{margin:14mm}
}
</style>
</head>
<body>

<div class="barra">
  <div class="barra-in">
    <div class="marca"><b>Bitácora TiL</b><span>Laguna · Durango · Saltillo</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="sync" id="estado" title="Estado de sincronización"><span class="punto off"></span><span id="estado-txt">local</span></button>
    <button class="btn chico" id="btn-nuevo">+ Cliente</button>
  </div>
</div>

<main id="vista"></main>
<div class="capa" id="capa-ficha" hidden></div>
<div class="capa" id="capa-form" hidden></div>
<div id="impresion"></div>

<script>
(function(){
"use strict";
var VERSION="2.0", LLAVE="bitacora-til-datos", LLAVE_CFG="bitacora-til-config", ARCHIVO="bitacora-til.json";
var SCOPE="https://www.googleapis.com/auth/drive.file";

function pad(n){return (n<10?"0":"")+n;}
function fechaDe(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
var HOY=fechaDe(new Date());
function id(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
function ahora(){return Date.now();}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function sumaDias(f,n){var p=String(f).split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+(+n||0));return fechaDe(d);}
function dias(a,b){var pa=String(a).split("-"),pb=String(b).split("-");return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/864e5);}
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaCorta(f){if(!f)return "—";var p=String(f).split("-");return (+p[2])+" "+MESES[+p[1]-1]+" "+p[0].slice(2);}
function fechaLarga(f){var p=String(f).split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return DIAS[d.getDay()]+" "+(+p[2])+" de "+MESESL[+p[1]-1]+" de "+p[0];}
function relativo(f){if(!f)return "";var d=dias(HOY,f);if(d===0)return "hoy";if(d===1)return "mañana";if(d===-1)return "ayer";return d<0?("hace "+(-d)+" d"):("en "+d+" d");}
function hora(ts){return new Date(ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});}

var CIUDADES=["Torreón","Gómez Palacio","Lerdo","Durango","Saltillo","Monclova","Ramos Arizpe","Otra"];
var SECTORES=["Clínico","Alimentos","Agua y suelo","Minería / metalurgia","Automotriz","Farmacéutico","Académico","Agropecuario","Ambiental","Otro"];
var ESTADOS=["Prospecto","Contactado","Cotización enviada","Negociación","Cliente activo","En pausa"];
var TIPOS=["Visita","Llamada","WhatsApp","Correo","Cotización","Demostración"];
var COLS=["clientes","productos","contactos","agenda"];

var S={clientes:[],productos:[],contactos:[],agenda:[],borrados:{},creado:null,
  vista:"panel",filtros:{q:"",ciudad:"",sector:"",estado:""},ficha:null,msg:"",msgBien:false,sucio:false};

var N={clientId:null,token:null,expira:0,fileId:null,marcaRemota:null,correo:null,cliente:null,
  gisListo:false,estado:"off",detalle:"local",ultima:null,error:null,cbToken:null,cbError:null};

/* ===================== ALMACÉN LOCAL ===================== */
function paquete(){
  return {app:"bitacora-til",version:VERSION,guardado:new Date().toISOString(),creado:S.creado||new Date().toISOString(),
    clientes:S.clientes,productos:S.productos,contactos:S.contactos,agenda:S.agenda,borrados:S.borrados};
}
function guardaLocal(){
  try{localStorage.setItem(LLAVE,JSON.stringify(paquete()));}
  catch(e){aviso("El navegador no dejó guardar en este equipo. Exporta un respaldo.");}
}
function cargaLocal(){
  try{var c=localStorage.getItem(LLAVE);if(c){aplica(JSON.parse(c));return true;}}catch(e){}
  return false;
}
function aplica(d){
  COLS.forEach(function(k){S[k]=(d[k]||[]).map(function(r){if(!r.act)r.act=1;return r;});});
  S.borrados=d.borrados||{};S.creado=d.creado||new Date().toISOString();
}
function guardaCfg(){
  try{localStorage.setItem(LLAVE_CFG,JSON.stringify({clientId:N.clientId,fileId:N.fileId,correo:N.correo}));}catch(e){}
}
function cargaCfg(){
  try{var c=JSON.parse(localStorage.getItem(LLAVE_CFG)||"{}");N.clientId=c.clientId||null;N.fileId=c.fileId||null;N.correo=c.correo||null;}catch(e){}
}

/* ===================== ESCRITURA ===================== */
function guardar(col,obj){
  obj.act=ahora();
  var arr=S[col],i=-1;
  for(var k=0;k<arr.length;k++)if(arr[k].id===obj.id){i=k;break;}
  if(i<0)arr.push(obj);else arr[i]=obj;
  tras();
}
function borrar(col,docId){
  S[col]=S[col].filter(function(x){return x.id!==docId;});
  S.borrados[docId]=ahora();
  tras();
}
function tras(){S.sucio=true;guardaLocal();pinta();programaSync();}
function aviso(t,bien){S.msg=t;S.msgBien=!!bien;pinta();setTimeout(function(){if(S.msg===t){S.msg="";pinta();}},6000);}

/* ===================== FUSIÓN ENTRE DISPOSITIVOS ===================== */
function fusiona(local,remoto){
  var res={creado:local.creado||remoto.creado,borrados:{}};
  var b={};
  [local.borrados||{},remoto.borrados||{}].forEach(function(m){
    for(var k in m)if(!b[k]||m[k]>b[k])b[k]=m[k];
  });
  var corte=ahora()-90*864e5, cambios=0;
  for(var k2 in b)if(b[k2]>corte)res.borrados[k2]=b[k2];
  COLS.forEach(function(c){
    var mapa={};
    (remoto[c]||[]).forEach(function(r){mapa[r.id]=r;});
    (local[c]||[]).forEach(function(r){
      var o=mapa[r.id];
      if(!o||(r.act||1)>=(o.act||1)){if(!o||JSON.stringify(o)!==JSON.stringify(r))cambios++;mapa[r.id]=r;}
      else cambios++;
    });
    res[c]=[];
    for(var k3 in mapa){
      var reg=mapa[k3];
      if(b[k3]&&b[k3]>(reg.act||1))continue;
      res[c].push(reg);
    }
  });
  res.cambios=cambios;
  return res;
}

/* ===================== GOOGLE DRIVE ===================== */
function estadoNube(e,detalle){
  N.estado=e;if(detalle!==undefined)N.detalle=detalle;
  var p=document.querySelector("#estado .punto"),t=document.getElementById("estado-txt");
  if(!p)return;
  p.className="punto "+(e==="on"?"on":e==="trabaja"?"trabaja":e==="mal"?"mal":"off");
  t.textContent=N.detalle;
}
function cargaGIS(){
  if(!N.clientId||N.gisListo)return;
  if(location.protocol==="file:"){estadoNube("off","sin nube (archivo local)");return;}
  var s=document.createElement("script");
  s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;
  s.onload=function(){
    try{
      N.cliente=google.accounts.oauth2.initTokenClient({
        client_id:N.clientId,scope:SCOPE,
        callback:function(r){if(N.cbToken)N.cbToken(r);},
        error_callback:function(e){if(N.cbError)N.cbError(e);}
      });
      N.gisListo=true;estadoNube("off","toca para conectar");
      arranqueNube();
    }catch(e){estadoNube("mal","ID de cliente inválido");}
  };
  s.onerror=function(){estadoNube("mal","sin internet");};
  document.head.appendChild(s);
}
/* Una sola petición de token a la vez, siempre con desenlace: resuelve, falla o expira. */
var peticionToken=null, abortaPendiente=null, pendienteInteractiva=false;
function pideToken(interactivo){
  if(peticionToken){
    if(!interactivo||pendienteInteractiva)return peticionToken;
    if(abortaPendiente)abortaPendiente();   /* un toque del usuario manda sobre el intento silencioso */
  }
  pendienteInteractiva=!!interactivo;
  peticionToken=new Promise(function(res,rej){
    if(!N.cliente){peticionToken=null;return rej(new Error("Google todavía no carga."));}
    var cerrado=false;
    function fin(err,tok){
      if(cerrado)return;
      cerrado=true;clearTimeout(reloj);N.cbToken=null;N.cbError=null;
      peticionToken=null;abortaPendiente=null;pendienteInteractiva=false;
      if(err)rej(err);else res(tok);
    }
    abortaPendiente=function(){fin(new Error("reemplazado"));};
    var reloj=setTimeout(function(){
      fin(new Error(interactivo?"Google no respondió. Si el navegador bloqueó la ventana emergente, permítela para este sitio y vuelve a tocar Conectar.":"sin respuesta de Google"));
    },interactivo?90000:12000);
    N.cbToken=function(r){
      if(!r||r.error)return fin(new Error((r&&(r.error_description||r.error))||"acceso no concedido"));
      N.token=r.access_token;N.expira=ahora()+(+r.expires_in||3500)*1000;fin(null,N.token);
    };
    N.cbError=function(e){
      var t=e&&e.type;
      fin(new Error(t==="popup_failed_to_open"?"el navegador bloqueó la ventana de Google; permite ventanas emergentes para este sitio":
        t==="popup_closed"?"se cerró la ventana de Google antes de terminar":(t||"no se pudo abrir el acceso de Google")));
    };
    try{N.cliente.requestAccessToken({prompt:interactivo?"consent":""});}catch(e){fin(e);}
  });
  return peticionToken;
}
/* Al abrir la página intenta reanudar la sesión sin molestar. Si no se puede, deja el botón listo. */
async function arranqueNube(){
  if(!(N.fileId||N.correo))return;
  try{await pideToken(false);await sincroniza();}
  catch(e){estadoNube("off","toca para conectar");}
}
async function token(){
  if(N.token&&N.expira>ahora()+60000)return N.token;
  return await pideToken(false);
}
async function api(url,opc){
  opc=opc||{};
  var t=await token();
  opc.headers=Object.assign({},opc.headers||{},{Authorization:"Bearer "+t});
  var r=await fetch(url,opc);
  if(r.status===401){N.token=null;var t2=await pideToken(false);opc.headers.Authorization="Bearer "+t2;r=await fetch(url,opc);}
  if(!r.ok){var txt=await r.text();throw new Error("Drive respondió "+r.status+": "+txt.slice(0,160));}
  return r;
}
async function localizaArchivo(){
  if(N.fileId){
    try{var r0=await api("https://www.googleapis.com/drive/v3/files/"+N.fileId+"?fields=id,modifiedTime,trashed");
      var m0=await r0.json();
      if(!m0.trashed){N.marcaRemota=m0.modifiedTime;return N.fileId;}}catch(e){N.fileId=null;}
  }
  var q=encodeURIComponent("name='"+ARCHIVO+"' and trashed=false");
  var r=await api("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,modifiedTime)&pageSize=5");
  var d=await r.json();
  if(d.files&&d.files.length){N.fileId=d.files[0].id;N.marcaRemota=d.files[0].modifiedTime;guardaCfg();return N.fileId;}
  return null;
}
async function creaArchivo(){
  var meta={name:ARCHIVO,mimeType:"application/json",description:"Datos de Bitácora TiL — no lo edites a mano"};
  var lim="-=-=bitacora"+Date.now();
  var cuerpo="--"+lim+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
    "\r\n--"+lim+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(paquete())+"\r\n--"+lim+"--";
  var r=await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime",
    {method:"POST",headers:{"Content-Type":'multipart/related; boundary="'+lim+'"'},body:cuerpo});
  var d=await r.json();N.fileId=d.id;N.marcaRemota=d.modifiedTime;guardaCfg();
  return d;
}
async function bajaArchivo(){
  var r=await api("https://www.googleapis.com/drive/v3/files/"+N.fileId+"?alt=media");
  var txt=await r.text();
  if(!txt.trim())return null;
  var d=JSON.parse(txt);
  if(d.app!=="bitacora-til")throw new Error("ese archivo de Drive no es de Bitácora TiL");
  return d;
}
async function subeArchivo(){
  var r=await api("https://www.googleapis.com/upload/drive/v3/files/"+N.fileId+"?uploadType=media&fields=id,modifiedTime",
    {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(paquete())});
  var d=await r.json();N.marcaRemota=d.modifiedTime;return d;
}
async function quienSoy(){
  try{var r=await api("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)");
    var d=await r.json();if(d.user&&d.user.emailAddress){N.correo=d.user.emailAddress;guardaCfg();}}catch(e){}
}

var sincronizando=false, temporizador=null;
function programaSync(){
  if(!N.clientId||!N.gisListo)return;
  if(temporizador)clearTimeout(temporizador);
  temporizador=setTimeout(function(){sincroniza();},3500);
}
async function sincroniza(manual){
  if(sincronizando&&!manual)return;
  if(!N.clientId||!N.gisListo){if(manual)aviso("Primero configura la conexión con Drive en la pestaña Nube.");return;}
  sincronizando=false;
  sincronizando=true;N.error=null;estadoNube("trabaja","sincronizando…");
  try{
    await token();
    if(!N.correo)await quienSoy();
    var existe=await localizaArchivo();
    if(!existe){await creaArchivo();S.sucio=false;}
    else{
      var remoto=await bajaArchivo();
      if(remoto){
        var antes=JSON.stringify([S.clientes,S.productos,S.contactos,S.agenda,S.borrados]);
        var f=fusiona(paquete(),remoto);
        COLS.forEach(function(c){S[c]=f[c];});
        S.borrados=f.borrados;S.creado=f.creado;
        var despues=JSON.stringify([S.clientes,S.productos,S.contactos,S.agenda,S.borrados]);
        var cambioLocal=antes!==despues;
        if(cambioLocal)guardaLocal();
        if(cambioLocal||S.sucio||JSON.stringify(remoto.clientes||[])!==JSON.stringify(S.clientes))await subeArchivo();
      }else await subeArchivo();
      S.sucio=false;
    }
    N.ultima=ahora();
    estadoNube("on","al día "+hora(N.ultima));
    pinta();
    if(manual)aviso("Sincronizado con Drive.",true);
  }catch(e){
    N.error=(e&&e.message)||"error desconocido";
    estadoNube("mal","sin sincronizar");
    if(manual)aviso("No se pudo sincronizar: "+N.error);
    pinta();
  }finally{sincronizando=false;}
}
async function conecta(){
  if(!N.clientId)return aviso("Falta el ID de cliente de Google. Configúralo en la pestaña Nube.");
  if(!N.gisListo){cargaGIS();return aviso("Google todavía está cargando; intenta en unos segundos.");}
  try{estadoNube("trabaja","conectando…");await pideToken(true);await sincroniza(true);}
  catch(e){estadoNube("off","toca para conectar");aviso("No se completó el acceso: "+((e&&e.message)||""));}
}
function desconecta(){
  N.token=null;N.expira=0;N.correo=null;N.fileId=null;N.marcaRemota=null;
  guardaCfg();estadoNube("off","toca para conectar");pinta();
  aviso("Desconectado. Los datos siguen en este equipo.",true);
}

function contactosDe(cid){return S.contactos.filter(function(x){return x.clienteId===cid;}).sort(function(a,b){return a.fecha<b.fecha?1:-1;});}
function agendaDe(cid){return S.agenda.filter(function(x){return x.clienteId===cid;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});}
function ultimoContacto(cid){var h=contactosDe(cid);return h.length?h[0].fecha:null;}
function proximoToque(c){return sumaDias(ultimoContacto(c.id)||c.alta||HOY,c.cadencia||30);}
function estadoToque(c){var d=dias(HOY,proximoToque(c));
  if(d<0)return{clase:"vence",txt:"vencido "+(-d)+" d",orden:d};
  if(d===0)return{clase:"hoy",txt:"toca hoy",orden:0};
  return{clase:"ok",txt:"en "+d+" d",orden:d};}
function nombreCliente(cid){var c=cliente(cid);return c?c.nombre:"—";}
function cliente(cid){return S.clientes.filter(function(x){return x.id===cid;})[0];}
function producto(pid){return S.productos.filter(function(x){return x.id===pid;})[0];}
function pendientes(){return S.agenda.filter(function(a){return !a.hecho;}).sort(function(a,b){return (a.fecha+(a.hora||""))<(b.fecha+(b.hora||""))?-1:1;});}

function descarga(nombre,texto,tipo){
  var b=new Blob([texto],{type:tipo||"application/json;charset=utf-8"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);
}
function textoCSV(){
  var cab=["Empresa","Contacto","Puesto","Telefono","Correo","Plaza","Sector","Etapa","Cadencia_dias","Ultimo_contacto","Siguiente_toque","Productos_interes","Notas"];
  var filas=S.clientes.map(function(c){return [c.nombre,c.contacto,c.puesto,c.tel,c.email,c.ciudad,c.sector,c.estado,c.cadencia,
    ultimoContacto(c.id)||"",proximoToque(c),(c.productos||[]).map(function(p){var o=producto(p);return o?o.nombre:"";}).filter(Boolean).join(" | "),c.notas];});
  return "﻿"+[cab].concat(filas).map(function(f){return f.map(function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
}
function importa(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||d.app!=="bitacora-til")throw new Error("no es un respaldo de Bitácora TiL");
      var f=fusiona(paquete(),d);
      COLS.forEach(function(c){S[c]=f[c];});S.borrados=f.borrados;
      S.sucio=true;guardaLocal();pinta();programaSync();
      aviso("Respaldo combinado: quedan "+S.clientes.length+" cuentas.",true);
    }catch(e){aviso("Ese archivo no se pudo leer ("+(e.message||"formato desconocido")+").");}
  };
  r.readAsText(file);
}
function imprimeRuta(){
  var pend=pendientes().filter(function(a){return a.fecha<=HOY;});
  var toques=S.clientes.map(function(c){return{c:c,t:estadoToque(c)};}).filter(function(x){return x.t.orden<=0;}).sort(function(a,b){return a.t.orden-b.t.orden;});
  var h="<h1>Hoja de ruta</h1><div class='sub'>"+esc(fechaLarga(HOY))+" — Bitácora TiL</div>";
  h+="<h2>Agenda ("+pend.length+")</h2>";
  h+=pend.length?pend.map(function(a){
    var c=cliente(a.clienteId)||{};
    return "<div class='it'><b>"+esc(a.titulo)+" — "+esc(nombreCliente(a.clienteId))+"</b><small>"+
      esc([c.ciudad,c.contacto,c.tel,a.hora?"a las "+a.hora:""].filter(Boolean).join(" · "))+(a.nota?"<br>"+esc(a.nota):"")+
      "</small><div class='ren'></div></div>";
  }).join(""):"<p>Sin citas.</p>";
  h+="<h2>Por recontactar ("+toques.length+")</h2>";
  h+=toques.length?toques.map(function(x){
    var c=x.c,u=ultimoContacto(c.id);
    return "<div class='it'><b>"+esc(c.nombre)+"</b><small>"+esc([c.ciudad,c.contacto,c.tel,c.estado].filter(Boolean).join(" · "))+
      " · "+esc(x.t.txt)+(u?" · último contacto "+esc(fechaCorta(u)):" · sin contacto previo")+
      ((c.productos||[]).length?"<br>Interés: "+esc((c.productos||[]).map(function(p){var o=producto(p);return o?o.nombre:"";}).filter(Boolean).join(", ")):"")+
      "</small><div class='ren'></div></div>";
  }).join(""):"<p>Nada vencido.</p>";
  document.getElementById("impresion").innerHTML=h;
  window.print();
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-vista],[data-ficha],[data-cierra],[data-edita],[data-registra],[data-cita],[data-toggle-prod],[data-cerrar-cita],[data-borra-contacto],[data-borra-cliente],[data-borra-prod],button[id]");
  if(!el)return;
  var d=el.dataset;
  switch(el.id){
    case "btn-nuevo":return formCliente();
    case "btn-prod":return formProducto();
    case "btn-csv":case "btn-csv2":return descarga("directorio-til-"+HOY+".csv",textoCSV(),"text/csv;charset=utf-8");
    case "btn-exportar":return descarga("bitacora-til-"+HOY+".json",JSON.stringify(paquete(),null,2));
    case "btn-importar":return document.getElementById("archivo-import").click();
    case "btn-imprimir":return imprimeRuta();
    case "estado":case "btn-sync":return void (N.clientId?(N.correo||N.fileId?sincroniza(true):conecta()):(S.vista="nube",pinta()));
    case "btn-conectar":return void conecta();
    case "btn-desconecta":return desconecta();
    case "btn-guarda-cid":{
      var v=(document.getElementById("cid").value||"").trim();
      if(!/\.apps\.googleusercontent\.com$/.test(v))return aviso("Ese ID no se ve bien; debe terminar en .apps.googleusercontent.com");
      N.clientId=v;guardaCfg();N.gisListo=false;cargaGIS();pinta();
      setTimeout(function(){conecta();},1200);return;}
    case "btn-cid-cambia":{N.clientId=null;guardaCfg();N.gisListo=false;return pinta();}
    case "btn-tema":{
      var r=document.documentElement,oscuro=r.getAttribute("data-theme")==="dark";
      r.setAttribute("data-theme",oscuro?"light":"dark");
      try{localStorage.setItem("bitacora-til-tema",oscuro?"light":"dark");}catch(e){}
      return;}
    case "btn-borrar-todo":{
      if(el.dataset.confirmado){try{localStorage.removeItem(LLAVE);}catch(e){}
        COLS.forEach(function(c){S[c]=[];});S.borrados={};guardaLocal();pinta();
        return aviso("Datos borrados de este dispositivo. Lo que esté en Drive sigue ahí.",true);}
      el.dataset.confirmado="1";el.textContent="Toca otra vez para confirmar";return;}
  }
  if(d.vista){S.vista=d.vista;pinta();window.scrollTo(0,0);return;}
  if(d.cierra==="ficha"){S.ficha=null;document.getElementById("capa-ficha").hidden=true;return;}
  if(d.cierra==="form")return cierraForm();
  if(d.ficha){S.ficha=d.ficha;pintaFicha();return;}
  if(d.edita)return formCliente(cliente(d.edita));
  if(d.registra)return formContacto(d.registra);
  if(d.cita)return formCita(d.cita);
  if(d.cerrarCita){var a=S.agenda.filter(function(x){return x.id===d.cerrarCita;})[0];
    if(a){var n={};for(var k in a)n[k]=a[k];n.hecho=true;guardar("agenda",n);}return;}
  if(d.borraContacto)return borrar("contactos",d.borraContacto);
  if(d.borraProd)return borrar("productos",d.borraProd);
  if(d.borraCliente){
    if(el.dataset.confirmado){
      S.ficha=null;document.getElementById("capa-ficha").hidden=true;
      contactosDe(d.borraCliente).forEach(function(x){S.borrados[x.id]=ahora();});
      agendaDe(d.borraCliente).forEach(function(x){S.borrados[x.id]=ahora();});
      S.contactos=S.contactos.filter(function(x){return x.clienteId!==d.borraCliente;});
      S.agenda=S.agenda.filter(function(x){return x.clienteId!==d.borraCliente;});
      return borrar("clientes",d.borraCliente);}
    el.dataset.confirmado="1";el.textContent="Toca otra vez para confirmar";return;}
  if(d.toggleProd){
    var c=cliente(S.ficha);if(!c)return;
    var l=(c.productos||[]).slice(),i=l.indexOf(d.toggleProd);
    if(i<0)l.push(d.toggleProd);else l.splice(i,1);
    var n2={};for(var k2 in c)n2[k2]=c[k2];n2.productos=l;return guardar("clientes",n2);}
});
